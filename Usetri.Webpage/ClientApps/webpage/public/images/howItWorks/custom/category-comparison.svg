<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kategória zoskupuje porovnateľné produkty s cenami">
  <!-- soft background blob -->
  <ellipse cx="200" cy="158" rx="182" ry="128" fill="#cfb0ff" fill-opacity="0.22" />

  <!-- ===== Category -> products connector ===== -->
  <g stroke="#5645cc" stroke-width="2.5" stroke-linecap="round">
    <line x1="200" y1="74" x2="200" y2="92" />
    <line x1="90" y1="92" x2="310" y2="92" />
    <line x1="90" y1="92" x2="90" y2="120" />
    <line x1="200" y1="92" x2="200" y2="116" />
    <line x1="310" y1="92" x2="310" y2="120" />
  </g>

  <!-- category pill -->
  <rect x="162" y="44" width="76" height="30" rx="15" fill="#e3d8ff" stroke="#5645cc" stroke-width="2.5" />
  <rect x="180" y="55" width="8" height="8" rx="1.5" fill="#5645cc" />
  <rect x="196" y="55" width="8" height="8" rx="1.5" fill="#5645cc" />
  <rect x="212" y="55" width="8" height="8" rx="1.5" fill="#5645cc" />

  <!-- ===== Product card 1 ===== -->
  <rect x="45" y="120" width="90" height="118" rx="14" fill="#ffffff" stroke="#5645cc" stroke-width="2.5" />
  <rect x="82" y="141" width="16" height="7" rx="2" fill="#5645cc" />
  <rect x="84" y="148" width="12" height="10" fill="#cfb0ff" />
  <rect x="72" y="158" width="36" height="44" rx="9" fill="#cfb0ff" stroke="#5645cc" stroke-width="2" />
  <rect x="72" y="173" width="36" height="13" fill="#5645cc" fill-opacity="0.85" />
  <rect x="60" y="209" width="60" height="23" rx="11" fill="#ffffff" stroke="#5645cc" stroke-width="2" />
  <text x="90" y="225" text-anchor="middle" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#5645cc">1,29&#8201;€</text>

  <!-- ===== Product card 2 (cheapest, highlighted) ===== -->
  <rect x="155" y="120" width="90" height="118" rx="14" fill="#ffffff" stroke="#5645cc" stroke-width="3.5" />
  <rect x="192" y="141" width="16" height="7" rx="2" fill="#5645cc" />
  <rect x="194" y="148" width="12" height="10" fill="#b69cff" />
  <rect x="182" y="158" width="36" height="44" rx="9" fill="#b69cff" stroke="#5645cc" stroke-width="2" />
  <rect x="182" y="173" width="36" height="13" fill="#5645cc" fill-opacity="0.85" />
  <rect x="170" y="209" width="60" height="23" rx="11" fill="#2fbf71" />
  <text x="200" y="225" text-anchor="middle" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">1,19&#8201;€</text>
  <!-- best-price check badge -->
  <circle cx="243" cy="124" r="13" fill="#2fbf71" stroke="#ffffff" stroke-width="2.5" />
  <path d="M 237 124 l 4 4 l 7 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ===== Product card 3 ===== -->
  <rect x="265" y="120" width="90" height="118" rx="14" fill="#ffffff" stroke="#5645cc" stroke-width="2.5" />
  <rect x="302" y="141" width="16" height="7" rx="2" fill="#5645cc" />
  <rect x="304" y="148" width="12" height="10" fill="#ddd0ff" />
  <rect x="292" y="158" width="36" height="44" rx="9" fill="#ddd0ff" stroke="#5645cc" stroke-width="2" />
  <rect x="292" y="173" width="36" height="13" fill="#5645cc" fill-opacity="0.85" />
  <rect x="280" y="209" width="60" height="23" rx="11" fill="#ffffff" stroke="#5645cc" stroke-width="2" />
  <text x="310" y="225" text-anchor="middle" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#5645cc">1,39&#8201;€</text>
</svg>
