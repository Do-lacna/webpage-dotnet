<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Akciové letáky">
  <!-- soft background blob -->
  <ellipse cx="200" cy="155" rx="155" ry="120" fill="#cfb0ff" fill-opacity="0.22" />

  <!-- BLUE leaflet (back) -->
  <g transform="translate(150 156) rotate(-14)">
    <rect x="-66" y="-86" width="132" height="172" rx="10" fill="#001122" fill-opacity="0.18" transform="translate(4 6)" />
    <rect x="-66" y="-86" width="132" height="172" rx="10" fill="#2f6bed" />
    <rect x="-66" y="-86" width="132" height="40" rx="10" fill="#001122" fill-opacity="0.22" />
    <rect x="-50" y="-74" width="64" height="9" rx="4" fill="#ffffff" fill-opacity="0.85" />
    <rect x="-50" y="-60" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.55" />
    <rect x="-50" y="-30" width="42" height="42" rx="6" fill="#ffffff" fill-opacity="0.8" />
    <rect x="2" y="-30" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.7" />
    <rect x="2" y="-14" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.5" />
    <rect x="-50" y="26" width="100" height="7" rx="3" fill="#ffffff" fill-opacity="0.55" />
    <rect x="-50" y="40" width="80" height="7" rx="3" fill="#ffffff" fill-opacity="0.4" />
    <rect x="-50" y="56" width="100" height="7" rx="3" fill="#ffffff" fill-opacity="0.4" />
  </g>

  <!-- RED leaflet (middle) -->
  <g transform="translate(206 150) rotate(-1)">
    <rect x="-66" y="-90" width="132" height="180" rx="10" fill="#001122" fill-opacity="0.18" transform="translate(4 6)" />
    <rect x="-66" y="-90" width="132" height="180" rx="10" fill="#e3493f" />
    <rect x="-66" y="-90" width="132" height="42" rx="10" fill="#001122" fill-opacity="0.22" />
    <rect x="-50" y="-78" width="68" height="9" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <rect x="-50" y="-63" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.6" />
    <rect x="-50" y="-32" width="46" height="46" rx="6" fill="#ffffff" fill-opacity="0.85" />
    <rect x="6" y="-30" width="48" height="8" rx="4" fill="#ffffff" fill-opacity="0.75" />
    <rect x="6" y="-14" width="48" height="8" rx="4" fill="#ffffff" fill-opacity="0.55" />
    <rect x="-50" y="28" width="104" height="7" rx="3" fill="#ffffff" fill-opacity="0.55" />
