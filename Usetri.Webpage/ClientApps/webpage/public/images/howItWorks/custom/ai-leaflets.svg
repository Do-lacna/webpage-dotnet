    <rect x="-50" y="60" width="104" height="7" rx="3" fill="#ffffff" fill-opacity="0.4" />
  </g>

  <!-- YELLOW leaflet (front) -->
  <g transform="translate(258 140) rotate(11)">
    <rect x="-64" y="-88" width="128" height="176" rx="10" fill="#001122" fill-opacity="0.18" transform="translate(4 6)" />
    <rect x="-64" y="-88" width="128" height="176" rx="10" fill="#f5d130" />
    <rect x="-64" y="-88" width="128" height="42" rx="10" fill="#001122" fill-opacity="0.18" />
    <rect x="-48" y="-76" width="66" height="9" rx="4" fill="#001122" fill-opacity="0.6" />
    <rect x="-48" y="-61" width="42" height="6" rx="3" fill="#001122" fill-opacity="0.4" />
    <rect x="-48" y="-30" width="44" height="44" rx="6" fill="#001122" fill-opacity="0.12" />
    <rect x="6" y="-28" width="48" height="8" rx="4" fill="#001122" fill-opacity="0.45" />
    <rect x="6" y="-12" width="48" height="8" rx="4" fill="#001122" fill-opacity="0.3" />
    <rect x="-48" y="30" width="100" height="7" rx="3" fill="#001122" fill-opacity="0.35" />
    <rect x="-48" y="44" width="78" height="7" rx="3" fill="#001122" fill-opacity="0.25" />
    <rect x="-48" y="62" width="100" height="7" rx="3" fill="#001122" fill-opacity="0.25" />
  </g>

  <!-- PERCENT badge (accent) -->
  <g transform="translate(300 96) rotate(8)">
    <circle cx="0" cy="0" r="30" fill="#001122" fill-opacity="0.18" transform="translate(3 5)" />
    <circle cx="0" cy="0" r="30" fill="#5645cc" />
    <circle cx="0" cy="0" r="30" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />
    <text x="0" y="11" text-anchor="middle" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff">%</text>
  </g>
