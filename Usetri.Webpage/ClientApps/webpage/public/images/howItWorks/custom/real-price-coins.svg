    <ellipse cx="190" cy="214" rx="78" ry="26" fill="#d9a93f" />
    <ellipse cx="190" cy="206" rx="78" ry="26" fill="#f5d130" />
    <!-- coin 2 (middle) -->
    <ellipse cx="190" cy="184" rx="78" ry="26" fill="#d9a93f" />
    <ellipse cx="190" cy="176" rx="78" ry="26" fill="#f5d130" />
    <!-- coin 1 (top) -->
    <ellipse cx="190" cy="154" rx="78" ry="26" fill="#d9a93f" />
